# 配置菜单导航的名称、路径和图标icon.
menu:
  Index:
    url: /
    icon: fas fa-home
  Categories:
    url: /categories
    icon: fas fa-bookmark
  Archives:
    url: /archives
    icon: fas fa-archive
  About:
    url: /about
    icon: fas fa-user-circle
  Contact:
    url: /contact
    icon: fas fa-comments
  Friends:
    url: /friends
    icon: fas fa-address-book
  Navigate:
    url: /navigate
    icon: fas fa-route

# 站点运行开始时间.
time:
  enable: true
  year: 2019  # 年份
  month: 12   # 月份
  date: 4     # 日期
  hour: 23    # 小时
  minute: 59  # 分钟
  second: 59  # 秒

# 首页封面轮播图的相关配置.
cover:
  showPrevNext: true    # 是否显示左右切换按钮.
  showIndicators: false # 是否显示指示器.
  autoLoop: false       # 是否自动轮播.
  duration: 120         # 切换延迟时间
  intervalTime: 5000    # 自动切换下一张的间隔时间.
  useConfig: false      # 是否使用配置文件, 在 _data/covers.json 下配置推荐文章, false则使用主题在文章中的配置 cover coverImg

# 配置首页显示"梦想"的语句.
dream:
  enable: true
  showTitle: false
  title: 信條
  text: 君子之行，靜以修身，儉以養德，非澹泊無以明志，非寧靜無以致遠。漢末|蜀國|諸葛亮

# 是否显示推荐文章的标题
recommend:
  enable: true
  showTitle: true
  useConfig: false # 是否使用配置文件, 在 _data/recommends.json 下配置推荐文章, false则会走主题配置的 top 属性
  # useConfig 使用方式: 将主题 matery/source/_data/recommends.json 移动到 my-blog/source/_data/下修改配置即可

# 配置网站favicon和网站LOGO
favicon: /favicon.png
logo: https://tencent.cos.mobaijun.com/img/icon/logo.png

# 首页 banner 中的第二个按钮的配置，包括按钮的显示名称、font awesome图标和按钮的超链接.
indexbtn:
  enable: true
  name: Get Theme
  icon: fas fa-cloud-download-alt
  url: https://codeload.github.com/mobaijun/hexo_blog_matery/zip/master

# 首页 banner 中的第二行个人信息配置，留空即不启用
socialLink:
  github: https://github.com/mobaijun
  gitee: https://gitee.com/mobaijun
  java:
  wechat: https://tencent.cos.mobaijun.com/img/icon/about.png
  email: mobaijun8@163.com
  rss: true # true、false

# 是否激活文章 TOC 功能，并配置TOC支持选中哪些标题类型，这是全局配置。
# 可以在某篇文章的 Front-matter 中再加上`toc: false`，使该篇文章关闭TOC目录功能
toc:
  enable: true
  heading: h2, h3, h4, h5
  collapseDepth: 0    # 目录默认展开层级
  showToggleBtn: true # 是否显示切换TOC目录展开收缩的按钮

# 代码块相关
code:
  lang: true   # 代码块是否显示名称
  copy: true   # 代码块是否可复制
  shrink: true # 代码块是否可以收缩
  break: false # 代码是否折行

# 是否激活文章末尾的打赏功能，默认激活（你替换为的你自己的微信、支付宝二维码图片、或者使用网络图片也可以）.
reward:
  enable: true
  title: 請我喝罐冰闊樂!
  wechat: https://tencent.cos.mobaijun.com/img/icon/wechat.png
  alipay: https://tencent.cos.mobaijun.com/img/icon/alipay.png

# 是否激活复制文章时追加博客和作者的版权信息.
copyright:
  enable: false
  minCharNumber: 120 # 至少复制多少个字符就追加版权信息.
  description: 本文章著作權歸作者所有，任何形式的轉載都請註明出處。

# 文章字数统计、阅读时长、总字数统计等
# 文章信息--若要开启文章字数统计，需要安装 hexo-wordcount 插件，安装命令: `npm i --save hexo-wordcount`
postInfo:
  date: true # 发布日期
  update: true # 更新日期
  wordCount: true # 文章字数统计
  totalCount: false # 站点总文章字数
  min2read: false # 文章阅读时长
  readCount: true # 文章阅读次数

# 是否激活点击页面的'爱心'效果，默认激活.
clicklove:
  enable: false

# | 文件名             | 说明                   |
# | :----------------- | :--------------------- |
# | sakura-small.js    | 少量樱花               |
# | sakura-half.js     | 樱花相对原效果数量减半 |
# | sakura-reduce.js   | 樱花相对原效果减少1/4  |
# | sakura.js          | 樱花数量不变（原效果） |
# 默认事sakura.js，如需修改，请到下面地址修改
# libs
#   js:
#     sakura: /libs/others/sakura-reduce.js
# 是否激活页面樱花效果, 只在桌面版网页启用特效
# 下面三种特效建议选择一种就够了，
sakura:
  enable: false

# 是否激活页面鼠标星星跟随效果, 只在桌面版网页启用特效
mouseStar:
  enable: false

# 是否激活页面飘雪效果, 只在桌面版网页启用特效
snowdown:
  enable: false

# 在”关于”页面中配置个人信息，包括头像、职业和个人介绍.
profile:
  avatar: https://tencent.cos.mobaijun.com/img/icon/avatar.jpg
  career: Java工程師 | 墨白
  introduction: 有道無術，術尚可求，有術無道，止於術！

