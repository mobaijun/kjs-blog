# 配置菜单导航的名称、路径和图标icon.
menu:
  Index:
    url: /
    icon: fas fa-home
  Categories:
    url: /categories
    icon: fas fa-bookmark
  Archives:
    url: /archives
    icon: fas fa-archive
  About:
    url: /about
    icon: fas fa-user-circle
  Contact:
    url: /contact
    icon: fas fa-comments
  Friends:
    url: /friends
    icon: fas fa-address-book
  Navigate:
    url: /navigate
    icon: fas fa-route

# 站点运行开始时间.
time:
  enable: true
  year: 2019  # 年份
  month: 12   # 月份
  date: 4     # 日期
  hour: 23    # 小时
  minute: 59  # 分钟
  second: 59  # 秒

# 首页封面轮播图的相关配置.
cover:
  showPrevNext: true    # 是否显示左右切换按钮.
  showIndicators: false # 是否显示指示器.
  autoLoop: false       # 是否自动轮播.
  duration: 120         # 切换延迟时间
  intervalTime: 5000    # 自动切换下一张的间隔时间.
  useConfig: false      # 是否使用配置文件, 在 _data/covers.json 下配置推荐文章, false则使用主题在文章中的配置 cover coverImg

# 配置首页显示"梦想"的语句.
dream:
  enable: true
  showTitle: false
  title: 信條
  text: 君子之行，靜以修身，儉以養德，非澹泊無以明志，非寧靜無以致遠。漢末|蜀國|諸葛亮

# 是否显示推荐文章的标题
recommend:
  enable: true
  showTitle: true
  useConfig: false # 是否使用配置文件, 在 _data/recommends.json 下配置推荐文章, false则会走主题配置的 top 属性
  # useConfig 使用方式: 将主题 matery/source/_data/recommends.json 移动到 my-blog/source/_data/下修改配置即可

# 配置网站favicon和网站LOGO
favicon: /favicon.png
logo: /img/icon/logo.png

# 首页 banner 中的第二个按钮的配置，包括按钮的显示名称、font awesome图标和按钮的超链接.
indexbtn:
  enable: true
  name: Get Theme
  icon: fas fa-cloud-download-alt
  url: https://codeload.github.com/mobaijun/hexo_blog_matery/zip/master

# 首页 banner 中的第二行个人信息配置，留空即不启用
socialLink:
  github: https://github.com/mobaijun
  gitee: https://gitee.com/mobaijun
  project: https://project.mobaijun.com/all.html
  wechat: /img/icon/about.png
  email: <your-email>
  rss: true # true、false

# 是否激活文章 TOC 功能，并配置TOC支持选中哪些标题类型，这是全局配置。
# 可以在某篇文章的 Front-matter 中再加上`toc: false`，使该篇文章关闭TOC目录功能
toc:
  enable: true
  heading: h2, h3, h4, h5
  collapseDepth: 0    # 目录默认展开层级
  showToggleBtn: true # 是否显示切换TOC目录展开收缩的按钮

# 是否激活文章广告框功能，并配置广告框内容，这是全局配置。
# 可以在某篇文章的 Front-matter 中再加上`adBox: false`，使该篇文章关闭广告框功能
adBox:
  enable: true
  title: 广告位
  icon: fas fa-ad
  content: |
    <div style="
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: url('/img/banner/2.jpg') center/cover no-repeat, #fafbfc;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(66,185,131,0.06);
      padding: 32px 12px 24px 12px;
      margin: 0 0 0 0;
      min-height: 180px;
      ">
      <div style="background: rgba(255,255,255,0.85); border-radius: 8px; padding: 18px 12px 12px 12px; width: 100%; text-align: center;">
        <p style="color: #222; font-size: 18px; font-weight: bold; margin-bottom: 10px;">广告位招租</p>
        <p style="color: #666; margin-bottom: 18px; font-size: 15px;">欢迎投放广告，提升品牌曝光</p>
        <a href="mailto:<your-email>"
           class="btn waves-effect waves-light"
           style="background-color: #42b983; color: #fff; font-size: 17px; border-radius: 24px; padding: 10px 32px; box-shadow: 0 2px 8px rgba(66,185,131,0.12); display: flex; align-items: center; gap: 8px; justify-content: center;">
          <i class="fas fa-envelope"></i> 联系我
        </a>
      </div>
    </div>

# 代码块相关
code:
  lang: true   # 代码块是否显示名称
  copy: true   # 代码块是否可复制
  shrink: true # 代码块是否可以收缩
  break: false # 代码是否折行

# 是否激活文章末尾的打赏功能，默认激活（你替换为的你自己的微信、支付宝二维码图片、或者使用网络图片也可以）.
reward:
  enable: true
  title: 請我喝罐冰闊樂!
  wechat: /img/icon/wechat.png
  alipay: /img/icon/alipay.png

# 是否激活复制文章时追加博客和作者的版权信息.
copyright:
  enable: false
  minCharNumber: 120 # 至少复制多少个字符就追加版权信息.
  description: 本文章著作權歸作者所有，任何形式的轉載都請註明出處。

# 文章字数统计、阅读时长、总字数统计等
# 文章信息--若要开启文章字数统计，需要安装 hexo-wordcount 插件，安装命令: `npm i --save hexo-wordcount`
postInfo:
  date: true # 发布日期
  update: true # 更新日期
  wordCount: true # 文章字数统计
  totalCount: true # 站点总文章字数
  min2read: false # 文章阅读时长
  readCount: true # 文章阅读次数

