<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>内核版本过低</title>
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <style>
        body {
            height: 100%;
            width: 100%;
            background: #fefefe url(https://cdn.mobaijun.com/qiniu_cdn/img/banner/6.jpg) center top fixed;
            -webkit-background-size: cover;
            -moz-background-size: cover;
            -o-background-size: cover;
            background-size: cover;
            color: #2E2F30;
            font-family: "Montserrat", sans-serif;
            margin: 0;
        }

        footer {
            position: absolute;
            bottom: 1%;
            width: 100%;
            text-align: center;
            font-size: 1em;
            color: #fff
        }

        /*修改引用链接文字颜色*/
        a {
            color: #23b6ef;
        }

        a:hover {
            color: #d35400;
        }

        .dialog {
            float: none;
            text-align: center;
            width: 75%;
            margin: 20% auto 0;
        }

        h1 {
            font-size: 3.5em;
            color: #fff;
            line-height: 1em;
        }

        p {
            font-size: 1.4em;
            color: #fff;
        }

        @media only screen and (max-width: 767px) {
            .dialog {
                width: 90%;
                margin: 20% auto 0;
            }
        }
    </style>
</head>
<body>
<div class="dialog">
    <h1>很抱歉为您停止了服务</h1>
    <p>您可能正在使用IE内核浏览我们的网页，但是本网页已经不在支持IE内核。建议您使用
        <a href="https://www.microsoft.com/zh-cn/edge">Edge浏览器进行访问</a>
    </p>
</div>
</body>
<footer><a href="https://mobaijun.gitee.io/mobai_images.gitee.io/ziliaoxiazai.html" target="_blank">惊喜|资料</a></footer>
</body>
</html>
