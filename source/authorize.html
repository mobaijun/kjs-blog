<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>软件授权过期</title>
    <style>
        body, html {
            height: 100%;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background-image: url("https://api.mobaijun.com/api/random_image");
            background-size: cover;
            background-position: center;
        }

        .container {
            text-align: center;
            background-color: rgba(255, 255, 255, 0.9);
            padding: 30px;
            border-radius: 10px;
            max-width: 600px;
            box-shadow: 0px 0px 20px rgba(0, 0, 0, 0.2);
        }

        h1 {
            color: #333;
            margin-bottom: 20px;
        }

        p {
            color: #555;
            margin-bottom: 10px;
        }

        .contact-link {
            color: #007bff;
            text-decoration: none;
            /* 显示为可点击的手型光标 */
            cursor: pointer;
        }

        .contact-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>软件授权申请</h1>
    <p>抱歉，您使用的软件已经过期，请申请授权以继续使用。</p>
    <p>请联系我们以获得授权。</p>
    <!-- 这里添加你的联系方式，可以是邮箱、电话等 -->
    <p>联系邮箱：<a href="mailto:mobaijun8@163.com">mobaijun8@163.com</a></p>
    <!-- 添加微信联系方式，并添加一个id用于JavaScript操作 -->
    <p id="wechat" class="contact-link">联系微信：mbj1916</p>
    <!-- 添加跳转链接到官网文档 -->
    <p><a href="https://docs.mobaijun.com/" target="_blank">点击这里查看我们的官网文档</a></p>
</div>

<script>
    // 找到微信联系方式元素
    var wechatLink = document.getElementById('wechat');

    // 点击微信联系方式时触发复制功能
    wechatLink.addEventListener('click', function () {
        // 创建一个临时的textarea元素
        var tempInput = document.createElement('textarea');
        // 设置元素的值为微信联系方式文本内容
        tempInput.value = 'mbj1916';
        // 将元素添加到页面中
        document.body.appendChild(tempInput);
        // 选中元素的内容
        tempInput.select();
        // 执行复制操作
        document.execCommand('copy');
        // 移除临时元素
        document.body.removeChild(tempInput);

        // 提示用户复制成功
        alert('微信号已复制到剪贴板！');
    });
</script>
</body>
</html>
