# Site
title: 框架師
subtitle: 墨白
description: 中南財經大學 | 金融管理 | 計算機應用
keywords: Java MySQL 编程语言 墨白 框架师 计算机应用
author: 墨白
language: zh-HK
timezone:

# URL
## Set your site url here. For example, if you use GitHub Page, set url as 'https://username.github.io/project'
url: https://www.mobaijun.com
root: /
permalink: posts/:abbrlink.html
# abbrlink配置
abbrlink:
  alg: crc32  # 算法：crc16(default) and crc32
  rep: dec    # 进制：dec(default) and hex
permalink_defaults:
  lang: en
pretty_urls:
  trailing_index: true # Set to false to remove trailing 'index.html' from permalinks
  trailing_html: true # Set to false to remove trailing '.html' from permalinks

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# Writing
new_post_name: :title.md # File name of new posts
default_layout: post
titlecase: false # Transform title into titlecase
external_link:
  enable: true # Open external links in new tab
  field: site # Apply to the whole site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true

# 代码高亮
highlight:
  enable: false
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false
prismjs:
  enable: true
  preprocess: true
  line_number: true
  tab_replace: ''

# Home page setting
# path: Root path for your blogs index page. (default = '')
# per_page: Posts displayed per page. (0 = disable pagination)
# order_by: Posts order. (Order by date descending by default)
index_generator:
  path: ''
  per_page: 18
  order_by: -date

# Category & Tag
default_category: uncategorized
category_map:
tag_map:

# Metadata elements
## https://developer.mozilla.org/en-US/docs/Web/HTML/Element/meta
meta_generator: true

# Date / Time format
## Hexo uses Moment.js to parse and display date
## You can customize the date format as defined in
## http://momentjs.com/docs/#/displaying/format/
date_format: YYYY-MM-DD
time_format: HH:mm:ss
## updated_option supports 'mtime', 'date', 'empty'
updated_option: 'mtime'

# Pagination
## Set per_page to 0 to disable pagination
per_page: 35
pagination_dir: page

# Include / Exclude file(s)
## include:/exclude: options only apply to the 'source/' folder
include:
exclude:
ignore:

# 主题选择
theme: matery

# 推送配置
deploy:
  - type: git
    repo:
      coding: https://e.coding.net/mobaijun/mobai.coding.me/mobai_blog.coding.me.git
      # coding: https://e.coding.net/mobaijun/mobai.coding.me/mobai_blog.coding.me.git
    branch: master
  - type: baidu_url_submitter

# 搜索
search:
  path: search.xml
  field: post
  content: false
  template: ./search.xml

# 中文链接转拼音
permalink_pinyin:
  enable: true
  separator: '-' # default: '-'

# 添加emoji表情支持
githubEmojis:
  enable: true
  className: github-emoji
  inject: true
  styles:
  customEmojis:

# RSS
feed:
  type: atom
  path: atom.xml
  limit: 20
  hub:
  content:
  content_limit: 140
  content_limit_delim: ' '
  order_by: -date

# 图片懒加载
lazyload:
  enable: true # 是否开启图片懒加载
  onlypost: true # 是否只对文章的图片做懒加载
  loadingImg: https://tencent.cos.mobaijun.com/img/gif/Stopwatch.gif

# 百度站长
baidu_url_submit:
  count: 10               # 提交最新的一个链接
  host: www.mobaijun.com   # 在百度站长平台中注册的域名
  token: IIC5lPpvqZp6ztH4  # 请注意这是您的秘钥， 所以请不要把博客源代码发布在公众仓库里!
  path: baidu_urls.txt     # 文本文档的地址， 新链接会保存在此文本文档里

# hexo-neat 优化提速插件（去掉HTML、css、js的blank字符）
neat_enable: true
neat_html:
  enable: true
  exclude:
    - '**/*.md'
neat_css:
  enable: true
  exclude:
neat_js:
  enable: true
  mangle: true
  output:
  compress:
  exclude:

hexo_external_link:
  #  是否开启hexo_external_link插件 - 默认 false
  enable: true
  #  是否对跳转url使用base64编码 - 默认 fasle
  enable_base64_encode: true
  #  url参数名,在跳转到外链传递给html_file_name的参数名 - 默认 ‘u’
  url_param_name: 'u'
  #  跳转到外链的页面文件路径 - 默认 ‘go.html’
  html_file_name: 'go.html'
  #  是否为外链的a标签添加target=’_blank’ - 默认 true
  target_blank: true
  #  设置外链的a标签的rel属性 - 默认 ‘external nofollow noopener noreferrer’
  link_rel: 'external nofollow noopener noreferrer'
  #  如果开启了防盗链,除了 localhost 和 domain(你的域名) 之外调用会跳到主页,同时也是判断链接是否为外链的依据 - 默认 window.location.host
  domain: '' # 如果开启了防盗链，填写你的域名
  #  为了防止外链盗用 对域名进行的判断 - 默认 false
  safety_chain: false

# hexo 中英文之间自动加空格
auto_spacing:
  enable: true

# Ads.txt
ads_txt: /ads.txt